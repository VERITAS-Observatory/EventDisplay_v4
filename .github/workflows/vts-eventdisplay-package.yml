---
name: VTS Eventdisplay Docker Image

on:
  workflow_dispatch:
    inputs:
      eventdisplay_ml_version:
        description: "Eventdisplay-ML version to install"
        required: false
        default: "3.2.0"
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches: ["main"]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  EVENTDISPLAY_ML_VERSION: 3.2.0

jobs:
  build-vts-eventdisplay-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: 'EventDisplay_v4'

      - name: Set build arguments
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            echo "BUILD_BRANCH=${GITHUB_HEAD_REF}" >> "$GITHUB_ENV"
          else
            echo "BUILD_BRANCH=${GITHUB_REF#refs/heads/}" >> "$GITHUB_ENV"
          fi

          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            if [[ -n "${{ inputs.eventdisplay_ml_version }}" ]]; then
              echo "EVENTDISPLAY_ML_VERSION=${{ inputs.eventdisplay_ml_version }}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            EVENTDISPLAY_ML_VERSION=${{ env.EVENTDISPLAY_ML_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          file: ./EventDisplay_v4/dockerfiles/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
